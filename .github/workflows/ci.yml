name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and production build
        run: pnpm check

      - name: Unit and synthetic migration regression tests
        run: pnpm test:unit

      - name: Live server unit tests
        run: pnpm test:functions

      - name: Firestore Security Rules tests
        run: pnpm test:rules

      - name: Live Auth, Firestore, and Functions emulator E2E
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:live"
