name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - chore/v2-staging-environment

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-filmovy-kviz-v2.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-filmovy-kviz-v2
      VITE_FIREBASE_STORAGE_BUCKET: demo-filmovy-kviz-v2.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: 1:123456789:web:demo
      VITE_FIREBASE_USE_EMULATORS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and production build
        run: pnpm check

      - name: Staging target and configuration guards (no cloud access)
        run: node --test tests/staging-guard.test.mjs

      - name: Unit and synthetic migration regression tests
        run: pnpm test:unit

      - name: Live server unit tests
        run: pnpm test:functions

      - name: Firestore Security Rules tests
        run: pnpm test:rules

      - name: Install Chromium for Print Center browser E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Live Auth, Firestore, and Functions emulator E2E
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:live && pnpm test:e2e:editor && pnpm test:e2e:events && pnpm test:e2e:registrations && node tools/local-emulator-environment.mjs full tests/e2e/registration-boundaries-emulator.mjs && node tools/local-emulator-environment.mjs full tests/e2e/event-team-tools-emulator.mjs && pnpm test:e2e:print"

      - name: Print Center browser E2E
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions,hosting
          --project demo-filmovy-kviz-v2
          "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:print-browser"

      - name: Registration browser E2E
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions,hosting
          --project demo-filmovy-kviz-v2
          "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:registrations-browser && pnpm exec playwright test --config tests/browser/event-team-tools.config.ts"
