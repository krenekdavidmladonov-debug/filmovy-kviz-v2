name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - codex/editor-storyboard
      - codex/editor-save-all
      - codex/performance-navigation
      - codex/historical-final-results
      - codex/owner-takeover
      - codex/justkviz-event-management
      - codex/justkviz-ui-cleanup-01
      - codex/justkviz-users-access
      - codex/justkviz-dark-mode
      - codex/justkviz-rebrand
      - codex/complete-quiz-editor
      - release/staging-editor-core-hotfix
      - main
      - chore/v2-staging-environment

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-filmovy-kviz-v2.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-filmovy-kviz-v2
      VITE_FIREBASE_STORAGE_BUCKET: demo-filmovy-kviz-v2.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: 1:123456789:web:demo
      VITE_FIREBASE_USE_EMULATORS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and production build
        run: pnpm check

      - name: Staging guards, release inventory and synthetic email activation contracts (no cloud access)
        run: |
          node -e "require('node:fs').mkdirSync('.local-data', { recursive: true })"
          node --test tests/staging-guard.test.mjs tests/restart-release-manifest.test.mjs tests/restart-build.test.mjs tools/email/oauth-connect.test.mjs tools/email/build-activation.test.mjs tests/restart-deploy-guard.test.mjs tests/restart-qa.test.mjs tests/access/pause-collaboration.test.mjs tools/email/activation-plan.test.mjs tools/event-night/restart-acceptance.test.mjs

      - name: Unit and synthetic migration regression tests
        run: pnpm test:unit

      - name: Migration create-only and existing emulator regression (synthetic only)
        run: >-
          pnpm exec firebase emulators:exec --only firestore --project demo-filmovy-kviz-v2
          "node tools/migration-v1/test/emulator.mjs"

      - name: Live server unit tests
        run: pnpm test:functions

      - name: Firestore Security Rules tests
        run: pnpm test:rules

      - name: Install Playwright Chromium for browser E2E
        run: pnpm exec playwright install chromium

      - name: Personal access Firestore and Storage isolation contracts
        run: >-
          pnpm exec firebase emulators:exec --only firestore,storage --project demo-justkviz-access --config firebase.access-rules.json
          "pnpm exec vitest run --config vitest.access-rules.config.ts"

      - name: Personal invitations, five browser identities, revoked grants and password recovery
        run: >-
          pnpm exec firebase emulators:exec --only auth,firestore,functions,storage --project demo-filmovy-kviz-v2
          "node tools/local-emulator-environment.mjs full tests/access/emulator.mjs && node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/personal-access.config.ts && node tools/local-emulator-environment.mjs full tests/access/media-sessions.mjs"

      - name: Editor core workflow browser E2E (local emulators only)
        run: |
          pnpm exec firebase emulators:exec --only auth,firestore,functions --project demo-filmovy-kviz-v2 "pnpm seed:auth && pnpm test:e2e:editor-core-empty-browser"
          pnpm exec firebase emulators:exec --only auth,firestore,functions --project demo-filmovy-kviz-v2 "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:editor-core-browser && node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/editor-outline-dnd.config.ts && node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/editor-save-all.config.ts"

      - name: Live Auth, Firestore, and Functions emulator E2E
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:live && pnpm test:e2e:editor && pnpm test:e2e:events && pnpm test:e2e:registrations && node tools/local-emulator-environment.mjs full tests/e2e/registration-boundaries-emulator.mjs && node tools/local-emulator-environment.mjs full tests/e2e/event-team-tools-emulator.mjs && pnpm test:e2e:print"

      - name: Print Center browser E2E
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions,hosting
          --project demo-filmovy-kviz-v2
          "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:print-browser"

      - name: Registration browser E2E
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions,hosting
          --project demo-filmovy-kviz-v2
          "pnpm seed:auth && pnpm seed:quizzes && pnpm test:e2e:registrations-browser && pnpm exec playwright test --config tests/browser/event-team-tools.config.ts"

      - name: Referee access contracts and browser E2E (local emulators only)
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "pnpm seed:quizzes && node tools/local-emulator-environment.mjs full tests/e2e/referee-access-emulator.mjs && pnpm exec playwright test --config tests/browser/referee-access.config.ts"

      - name: Registration email, Gmail worker contracts and fake browser E2E (local emulators only)
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "pnpm test:e2e:registration-email && node tools/local-emulator-environment.mjs full tests/e2e/email-activation-emulator.mjs && pnpm test:e2e:gmail-delivery && pnpm test:e2e:registration-email-browser && pnpm test:e2e:event-team-email && pnpm test:e2e:event-team-email-browser"

      - name: Interim leaderboard contracts and browser E2E (local emulators only)
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "node tools/local-emulator-environment.mjs full tests/e2e/interim-results-emulator.mjs && node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/interim-results.config.ts"

      - name: Final reveal contracts and browser E2E (local emulators only)
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "node tools/local-emulator-environment.mjs full tests/e2e/final-reveal-emulator.mjs && node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/final-reveal.config.ts"

      - name: Historical completed results browser E2E (local emulators only)
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions
          --project demo-filmovy-kviz-v2
          "node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/historical-results.config.ts"

      - name: One authored event from quiz creation through final reveal and history
        run: >-
          pnpm exec firebase emulators:exec --only auth,firestore,functions --project demo-filmovy-kviz-v2
          "node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/restart-event-acceptance.config.ts"

      - name: Owned media Storage contracts and browser E2E (local emulators only)
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore,functions,storage
          --project demo-filmovy-kviz-v2
          "pnpm test:e2e:media && pnpm test:e2e:media-browser"

      - name: Complete editor UI acceptance and private draft contracts (fresh local emulators)
        run: >-
          pnpm exec firebase emulators:exec --only auth,firestore,functions,storage --project demo-filmovy-kviz-v2
          "pnpm test:e2e:complete-editor && node tools/local-emulator-environment.mjs full tests/e2e/complete-editor-boundaries.mjs && pnpm test:e2e:complete-editor-performance && node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/dark-theme.config.ts"

      - name: Event management lifecycle, isolated deletion and normal browser UI
        run: >-
          pnpm exec firebase emulators:exec --only auth,firestore,functions,storage --project demo-filmovy-kviz-v2
          "node tools/local-emulator-environment.mjs full tests/e2e/event-management-emulator.mjs && node tools/local-emulator-environment.mjs full node_modules/@playwright/test/cli.js test --config tests/browser/event-management.config.ts"

  oauth-windows:
    name: Synthetic email Windows protection and compiler environment
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Diagnose synthetic Windows directory owner and ACL prerequisites
        shell: powershell
        run: |
          # PowerShell 5.1; synthetic empty directory only. Retain directory; no cleanup.
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $stage = 'BOOTSTRAP'
          $ownerUser = $null
          $ownerAdministrators = $null
          $ok = $false
          try {
            $stage = 'NEW_DIRECTORY'
            $localRoot = [IO.Path]::Combine((Get-Location).Path, '.local-data')
            if (-not [IO.Directory]::Exists($localRoot)) { [void][IO.Directory]::CreateDirectory($localRoot) }
            if (([IO.File]::GetAttributes($localRoot) -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Stop' }
            $directory = [IO.Path]::Combine($localRoot, 'ci-acl-probe-' + [Guid]::NewGuid().ToString('N'))
            if ([IO.Directory]::Exists($directory) -or [IO.File]::Exists($directory)) { throw 'Stop' }
            [void][IO.Directory]::CreateDirectory($directory)
            if ([IO.Directory]::GetFileSystemEntries($directory).Length -ne 0) { throw 'Stop' }
            $stage = 'READ_BEFORE'
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
            $acl = [IO.Directory]::GetAccessControl($directory)
            $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            $ownerUser = $owner -eq $sid.Value
            $ownerAdministrators = $owner -eq 'S-1-5-32-544'
            $stage = 'OWNER_BEFORE'
            if (-not $ownerUser) { throw 'Stop' }
            $stage = 'BUILD_ACL'
            $acl.SetAccessRuleProtection($true, $false)
            foreach ($rule in $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])) {
              [void]$acl.RemoveAccessRuleSpecific($rule)
            }
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'))
            $stage = 'WRITE_ACL'
            [IO.Directory]::SetAccessControl($directory, $acl)
            $stage = 'READ_AFTER'
            $check = [IO.Directory]::GetAccessControl($directory)
            $stage = 'OWNER_AFTER'
            if ($check.GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $sid.Value) { throw 'Stop' }
            $stage = 'INHERITANCE_AFTER'
            if (-not $check.AreAccessRulesProtected) { throw 'Stop' }
            $stage = 'RULE_COUNT_AFTER'
            $rules = $check.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])
            if ($rules.Count -ne 1) { throw 'Stop' }
            $stage = 'RULE_ACCESS_AFTER'
            foreach ($rule in $rules) {
              if ($rule.IdentityReference.Value -ne $sid.Value -or $rule.AccessControlType -ne 'Allow' -or $rule.FileSystemRights -ne 'FullControl') { throw 'Stop' }
            }
            $stage = 'COMPLETE'
            $ok = $true
          } catch { }
          [Console]::Out.WriteLine((@{ ok = $ok; stage = $stage; ownerUser = $ownerUser; ownerAdministrators = $ownerAdministrators } | ConvertTo-Json -Compress))

      # Built-in Node modules only; no credentials, cloud services or dependency install.
      # Exercise actual Windows ACL/DPAPI and child environment isolation.
      - name: Synthetic OAuth and activation contracts including Windows protection
        run: |
          node -e "require('node:fs').mkdirSync('.local-data', { recursive: true })"
          node --test tools/email/oauth-connect.test.mjs tools/email/build-activation.test.mjs
