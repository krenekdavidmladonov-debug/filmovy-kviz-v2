name: Operator owner takeover
on:
  push:
    branches: [codex/owner-takeover, main]
    paths: ['tools/access/**', 'tools/staging/**', 'tests/access/owner-takeover*', '.github/workflows/owner-takeover.yml']
  pull_request:
    paths: ['tools/access/**', 'tools/staging/**', 'tests/access/owner-takeover*', '.github/workflows/owner-takeover.yml']
permissions:
  contents: read
jobs:
  operator-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-filmovy-kviz-v2.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-filmovy-kviz-v2
      VITE_FIREBASE_STORAGE_BUCKET: demo-filmovy-kviz-v2.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:demo
      VITE_FIREBASE_USE_EMULATORS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test tests/access/owner-takeover.test.mjs
      - name: Synthetic takeover, stale tokens, concurrency and Firestore Rules
        run: >-
          pnpm exec firebase emulators:exec --only auth,firestore --project demo-filmovy-kviz-v2
          "node tools/local-emulator-environment.mjs full tests/access/owner-takeover-emulator.mjs && pnpm test:rules:run"
